policies:
  - id: WINDOWS-DEFENDER-001
    title: Enable Microsoft Defender real-time protection
    collector: defender_realtime_protection
    expected: "true"
    severity: HIGH
    comparator: exact

  - id: WINDOWS-FIREWALL-001
    title: Enable Windows Firewall for all profiles
    collector: windows_firewall_all_enabled
    expected: "true"
    severity: HIGH
    comparator: exact

  - id: WINDOWS-ACCOUNT-001
    title: Disable built-in Guest account
    collector: guest_account_enabled
    expected: "false"
    severity: MEDIUM
    comparator: exact

  - id: WINDOWS-SMB-001
    title: Disable SMBv1 protocol
    collector: smb1_enabled
    expected: "false"
    severity: HIGH
    comparator: exact

  - id: WINDOWS-SMB-002
    title: Require SMB server signing
    collector: smb_signing_required
    expected: "true"
    severity: HIGH
    comparator: exact

  - id: WINDOWS-UAC-001
    title: Enable User Account Control
    collector: uac_enabled
    expected: "1"
    severity: HIGH
    comparator: exact

  - id: WINDOWS-DEFENDER-002
    title: Enable Microsoft Defender behavior monitoring
    collector: defender_behavior_monitor
    expected: "true"
    severity: HIGH
    comparator: exact

  - id: WINDOWS-RDP-001
    title: Disable Remote Desktop when not required
    collector: rdp_denied
    expected: "1"
    severity: MEDIUM
    comparator: exact

  - id: WINDOWS-RDP-002
    title: Require Network Level Authentication for RDP
    collector: rdp_nla_required
    expected: "1"
    severity: HIGH
    comparator: exact

  - id: WINDOWS-DISK-001
    title: Enable BitLocker protection on system drive
    collector: bitlocker_protection
    expected: "on"
    severity: HIGH
    comparator: exact

  - id: WINDOWS-TPM-001
    title: Require TPM to be present and ready
    collector: tpm_ready
    expected: "true"
    severity: HIGH
    comparator: exact

  - id: WINDOWS-BOOT-001
    title: Enable Secure Boot
    collector: secure_boot_enabled
    expected: "true"
    severity: HIGH
    comparator: exact

  - id: WINDOWS-ACCOUNT-002
    title: Disable built-in Administrator account
    collector: builtin_administrator_enabled
    expected: "false"
    severity: HIGH
    comparator: exact

  - id: WINDOWS-SMB-003
    title: Require SMB client signing
    collector: smb_client_signing_required
    expected: "true"
    severity: HIGH
    comparator: exact