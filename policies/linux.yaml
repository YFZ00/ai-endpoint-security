policies:
  - id: LINUX-SSH-001
    title: Disable direct SSH login for root
    collector: permit_root_login
    expected: "no"
    severity: HIGH
    comparator: exact

  - id: LINUX-SSH-002
    title: Disable SSH password authentication
    collector: password_authentication
    expected: "no"
    severity: HIGH
    comparator: exact

  - id: LINUX-SSH-003
    title: Disable SSH login for accounts with empty passwords
    collector: permit_empty_passwords
    expected: "no"
    severity: HIGH
    comparator: exact

  - id: LINUX-SSH-004
    title: Limit SSH authentication attempts
    collector: max_auth_tries
    expected: 4
    severity: MEDIUM
    comparator: less_than_or_equal

  - id: LINUX-FILE-001
    title: Protect /etc/passwd ownership and permissions
    collector: passwd_file_security
    expected: "root:root 644"
    severity: HIGH
    comparator: exact

  - id: LINUX-FILE-002
    title: Protect /etc/shadow ownership and permissions
    collector: shadow_file_security
    expected: "root:shadow 640"
    severity: HIGH
    comparator: exact

  - id: LINUX-FILE-003
    title: Protect /etc/group ownership and permissions
    collector: group_file_security
    expected: "root:root 644"
    severity: HIGH
    comparator: exact

  - id: LINUX-FILE-004
    title: Protect /etc/gshadow ownership and permissions
    collector: gshadow_file_security
    expected: "root:shadow 640"
    severity: HIGH
    comparator: exact